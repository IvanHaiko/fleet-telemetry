services:
  archive:
    image: fleet-telemetry/seaweed-m4:4.48-local1@sha256:460f0162e5fbcfeef1571308be4e5ddb457cb74f35e50e50434902b4549c4097
    pull_policy: never
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    environment:
      GOMEMLIMIT: 512MiB
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master.peers=127.0.0.1:9333
      - -master.telemetry=false
      - -master.volumeSizeLimitMB=64
      - -master.volumePreallocate=false
      - -master.vacuumDeleteEmptyAfterSeconds=0
      - -volume.max=4
      - -volume.minFreeSpace=1GiB
      - -volume.fileSizeLimitMB=16
      - -filer=true
      - -filer.maxMB=16
      - -filer.exposeDirectoryData=false
      - -s3=true
      - -s3.ip.bind=0.0.0.0
      - -s3.config=/run/secrets/s3.json
      - -s3.iam=false
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.concurrentUploadLimitMB=32
      - -s3.readerCacheSizeMB=32
      - -webdav=false
      - -sftp=false
      - -iam=false
      - -mq.broker=false
      - -mq.agent=false
      - -metricsPort=0
    ports:
      - "127.0.0.1:${M4_S3_PORT:-18333}:8333"
    volumes:
      - archive-data:/data
      - type: bind
        source: ../runtime/s3/archive-master.toml
        target: /etc/seaweedfs/master.toml
        read_only: true
      - type: bind
        source: ${M4_S3_CONFIG:?Set the absolute local credential file path}
        target: /run/secrets/s3.json
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    networks: [archive-private]
    logging:
      driver: json-file
      options:
        max-size: 8m
        max-file: "1"

volumes:
  archive-data:

networks:
  archive-private:
    driver: bridge
