# Apply after m4-storage.yml and m6.yml in the continuous project.
services:
  taskmanager:
    pids_limit: 4096
    environment:
      FLEET_TASK_SLOTS: "18"
  jobmanager:
    pids_limit: 512
  serving:
    networks: !override [default, monitoring]
  prometheus:
    volumes:
      - ../runtime/continuous/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  archive:
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master.peers=127.0.0.1:9333
      - -master.telemetry=false
      - -master.volumeSizeLimitMB=64
      - -master.volumePreallocate=false
      - -master.vacuumDeleteEmptyAfterSeconds=0
      - -volume.max=128
      - -volume.minFreeSpace=1GiB
      - -volume.fileSizeLimitMB=16
      - -filer=true
      - -filer.maxMB=16
      - -filer.exposeDirectoryData=false
      - -s3=true
      - -s3.ip.bind=0.0.0.0
      - -s3.config=/run/secrets/s3.json
      - -s3.iam=false
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.concurrentUploadLimitMB=32
      - -s3.readerCacheSizeMB=32
      - -webdav=false
      - -sftp=false
      - -iam=false
      - -mq.broker=false
      - -mq.agent=false
      - -metricsPort=0
