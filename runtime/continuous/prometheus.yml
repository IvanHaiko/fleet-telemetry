global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
    sample_limit: 2000
  - job_name: flink
    static_configs:
      - targets: [jobmanager:9249, taskmanager:9249]
    # The eighteen-branch graph has exposed 10,638 samples. Keep a finite margin.
    sample_limit: 20000
    body_size_limit: 8MB
    label_limit: 20
    metric_relabel_configs:
      - action: drop
        source_labels: [__name__]
        regex: flink_.*_split_.*
      - action: labeldrop
        regex: host|job_id|tm_id|task_id|operator_id|task_attempt_id|task_attempt_num|topic
  - job_name: serving
    static_configs:
      - targets: [serving:9363]
    sample_limit: 5000
    label_limit: 10
  - job_name: continuous
    scrape_interval: 5s
    scrape_timeout: 2s
    static_configs:
      - targets: [host.docker.internal:18766]
    sample_limit: 100
