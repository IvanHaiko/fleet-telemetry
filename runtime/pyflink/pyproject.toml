[project]
name = "fleet-pyflink-compatibility"
version = "0.1.0"
description = "Isolated Linux PyFlink compatibility experiments"
requires-python = "==3.12.13"
dependencies = ["apache-flink==2.2.1"]

[dependency-groups]
dev = [
    "pytest==9.1.1", "ruff==0.16.5", "mypy==1.15.0",
    "setuptools==84.2.1", "wheel==0.48.0",
]

[tool.uv]
package = false
required-version = "==0.11.19"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
build-constraint-dependencies = [
    "setuptools==84.2.1", "wheel==0.48.0", "packaging==26.3",
]

[tool.pytest.ini_options]
testpaths = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/../.."

[[tool.mypy.overrides]]
module = "pyflink.*"
follow_untyped_imports = true
