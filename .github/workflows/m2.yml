name: M2 synthetic broker acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_LINK_MODE: copy
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned environment manager
        run: python -m pip install --disable-pip-version-check uv==0.11.19
      - name: Prepare locked independent client and cached profiles
        run: |
          uv sync --frozen --extra ulog --no-python-downloads --python python
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.local-discovery/kafka-ci" uv sync --frozen --extra kafka --no-python-downloads --python python
          mkdir -p .local-discovery/kafka-install-temp .local-discovery/ci-run
          .venv/bin/python -S telemetry_convert.py --job tests/fixtures/synthetic-conversion-job.json --output .local-discovery/ci-run/demo-synthetic-001
      - name: Prepare pinned broker image context
        run: python scripts/prepare-kafka-image.py
      - name: Initialize owned local broker and stop it
        id: runtime
        run: |
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          docker compose -p fleet-kafka-440-probe -f compose/kafka.yml up -d --build kafka
          broker_ready=0
          for attempt in $(seq 1 20); do
            if timeout 10s docker compose -p fleet-kafka-440-probe -f compose/kafka.yml exec -T kafka bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; then
              broker_ready=1
              break
            fi
            sleep 2
          done
          test "$broker_ready" = 1
          docker compose -p fleet-kafka-440-probe -f compose/kafka.yml stop kafka
      - name: Run full broker and offline acceptance matrix
        run: .local-discovery/kafka-ci/bin/python scripts/check-m2.py --job tests/fixtures/synthetic-conversion-job.json --run .local-discovery/ci-run/demo-synthetic-001 --prefix ci-reference --output .local-discovery/ci-matrix --docker-context default
      - name: Preserve stopped runtime boundary
        if: always() && steps.runtime.outcome != 'skipped'
        run: docker compose -p fleet-kafka-440-probe -f compose/kafka.yml stop kafka
      - name: Retain bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m2-synthetic-evidence
          path: .local-discovery/ci-matrix/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
